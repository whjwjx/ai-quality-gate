<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DocExtract - Quality Gate Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
    h1 { font-size: 24px; }
    .box { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 20px 0; }
    input[type=file] { margin: 12px 0; }
    button { background: #185FA5; color: white; border: 0; border-radius: 6px; padding: 10px 20px; cursor: pointer; }
    #result { margin-top: 16px; font-family: monospace; white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>DocExtract 冒烟测试页</h1>
  <p>最小页面，仅用于 Playwright 冒烟测试。选择 PDF 上传后返回结果。</p>
  <div class="box">
    <label for="file">选择 PDF 文件：</label><br>
    <input type="file" id="file" accept=".pdf">
    <input type="text" id="tenant" value="tenant-a" placeholder="tenant id" aria-label="tenant id">
    <button id="upload">上传</button>
    <div id="result">等待上传…</div>
  </div>
  <script>
    document.getElementById('upload').onclick = async () => {
      const file = document.getElementById('file').files[0];
      const tenant = document.getElementById('tenant').value || 'tenant-a';
      const result = document.getElementById('result');
      if (!file) { result.textContent = '请先选择文件'; return; }
      const form = new FormData();
      form.append('file', file);
      const resp = await fetch('/api/v1/documents/upload', {
        method: 'POST',
        headers: { 'X-Tenant-ID': tenant },
        body: form,
      });
      result.textContent = JSON.stringify(await resp.json(), null, 2);
    };
  </script>
</body>
</html>
