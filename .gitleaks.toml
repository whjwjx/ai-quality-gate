# Gitleaks 配置：在默认规则集基础上做项目级调整。
#
# 原则：只做「精确豁免」，永不做「全局关闭」。
# 每一条 allowlist 都必须能回答三个问题：
#   1. 为什么这个"密钥"不是真密钥？
#   2. 豁免范围为什么不能再小？
#   3. 谁在什么时间因为什么原因加的？

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# 红绿实验样本豁免（2026-11-24，用于验证 secret-scan 能拦截凭证泄露）
#
# 为什么不是真密钥：这是手工构造的占位字符串，遵循 ghp_ + 36 位的形态，
#   不对应任何真实账号，也无法调用任何 API。
#
# 为什么豁免"值"而不是"位置"：如果按路径豁免整个 tests/security/fixtures 目录，
#   以后任何人往这个目录里塞真密钥都不会被扫描到 —— 那等于开了个后门。
#   只豁免这一个确切字符串，任何其他凭证（哪怕放在同一个文件里）照样会被抓。
#
# 撤除条件：红绿实验演示完毕后，应连同假凭证文件一起删除。
# ---------------------------------------------------------------------------
[allowlist]
description = "红绿实验占位凭证：该值公开放置在仓库中，不对应任何真实账号"
condition = "AND"
paths = [
  '''tests/security/fixtures/fake_github_token\.txt$''',
]
regexTarget = "match"
regexes = [
  '''ghp_0123456789abcdefghijklmnopqrstuvwxyz''',
]
