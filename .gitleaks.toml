# Gitleaks 配置：在默认规则集基础上做项目级调整。
#
# 原则：只做「精确豁免」，永不做「全局关闭」。
# 每一条 allowlist 都必须能回答三个问题：
#   1. 为什么这个"密钥"不是真密钥？
#   2. 豁免范围为什么不能再小？
#   3. 谁在什么时间因为什么原因加的？

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# 红绿实验样本豁免（2026-11-24，用于验证 secret-scan 能拦截凭证泄露）
#
# 为什么不是真密钥：这是手工构造的占位字符串，遵循 ghp_ + 36 位的形态，
#   不对应任何真实账号，也无法调用任何 API。
#
# 为什么范围不能再小：这里豁免的是「具体值 + 具体文件」的组合，
#   而不是整个目录或整条规则。任何人都无法通过在这个文件里
#   塞入另一个真密钥来绕过扫描 —— 只有这一个字符串被放行。
#
# 如果用 paths 豁免整个 fixtures 目录，就埋下了"以后有人把真密钥
# 放进安全测试目录"的漏洞。豁免值比豁免位置安全得多。
# ---------------------------------------------------------------------------
[[allowlists]]
description = "红绿实验占位凭证，非真实密钥"
paths = [
  '''tests/security/fixtures/fake_github_token\.txt$''',
]
regexTarget = "match"
regexes = [
  '''ghp_0123456789abcdefghijklmnopqrstuvwxyz''',
]
