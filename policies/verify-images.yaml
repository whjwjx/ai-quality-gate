# Kyverno 准入策略：只允许「由本项目私钥签名」的镜像进入集群。
#
# 这条策略是整条供应链的最后一环：
#   - Cosign 签名只证明「这个 digest 是我签的」
#   - 只有准入控制器在**部署时**检查签名，才真正阻止未签名镜像运行
#
# 没有这条策略，签名只是个装饰 —— 任何人都能推镜像进集群。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify image signature
    policies.kyverno.io/description: >-
      拒绝未经本项目 Cosign 私钥签名的镜像，防止供应链替换攻击。
spec:
  # Enforce = 直接拒绝；Audit = 只记录。红绿实验靠这个开关对照。
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/whjwjx/ai-quality-gate*"
          # 镜像引用必须匹配 digest，避免用 tag 绕过（tag 可被重新指向）
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keys:
                    # 公钥来自仓库根目录的 cosign.pub，与 CI 签名用的私钥配对
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAENcdjj15O+kNbuRWlo5+fV/B14yl+
                      zwwA798LxgJbQoZvuzeVC7mpu13jfp1OIsqKSpUsShP/pP90CynP8eKjMg==
                      -----END PUBLIC KEY-----
