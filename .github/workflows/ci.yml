name: CI Quality Gate

# PR 触发：任何向 main / dev 的 PR 都必须先过这一关。
# workflow_dispatch：允许手动重跑，便于排查与演示。
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 逻辑全部在 scripts/ 里，这里只做编排 —— 换 GitLab CI 时 yaml 重写、脚本不动。
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: bash scripts/install.sh

      - name: API tests
        run: bash scripts/test_api.sh

      - name: E2E smoke
        run: bash scripts/test_e2e.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  # 评测门禁：证明「模型变差也能拦住」。独立 job 便于在 PR 上单独看到准确率结论。
  eval-gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      EXTRACTOR_BACKEND: replay
      PROMPT_VERSION: v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: bash scripts/install.sh

      - name: Extraction accuracy eval
        run: bash scripts/test_eval.sh

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval-report.md

  # 凭证扫描：密钥泄露零容忍，任何发现都阻断。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须取完整历史。默认 fetch-depth: 1 只扫最后一个 commit，
          # 历史提交里残留的密钥会被漏掉。
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 静态代码分析：规则在 security/semgrep-rules.yaml，自行维护避免 registry 噪音。
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep SAST
        run: bash scripts/scan_sast.sh

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: reports/semgrep.sarif

  # 依赖漏洞扫描：只阻断有修复方案的 HIGH/CRITICAL，否则门禁会被"上游还没修"的 CVE 卡死。
  # 扫 requirements.lock 而不是 requirements.txt —— 后者用 >=，版本不确定的包会被跳过。
  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: reports/trivy.sarif
          exit-code: "1"

      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: reports/sbom.json

      - name: Upload SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-artifacts
          path: |
            reports/trivy.sarif
            reports/sbom.json
