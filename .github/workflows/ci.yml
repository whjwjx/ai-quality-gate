name: CI Quality Gate

# PR 触发：任何向 main / dev 的 PR 都必须先过这一关。
# workflow_dispatch：允许手动重跑，便于排查与演示。
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 逻辑全部在 scripts/ 里，这里只做编排 —— 换 GitLab CI 时 yaml 重写、脚本不动。
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: bash scripts/install.sh

      - name: API tests
        run: bash scripts/test_api.sh

      - name: E2E smoke
        run: bash scripts/test_e2e.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  # 评测门禁：证明「模型变差也能拦住」。独立 job 便于在 PR 上单独看到准确率结论。
  eval-gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      EXTRACTOR_BACKEND: replay
      PROMPT_VERSION: v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: bash scripts/install.sh

      - name: Extraction accuracy eval
        run: bash scripts/test_eval.sh

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval-report.md

  # 凭证扫描：密钥泄露零容忍，任何发现都阻断。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须取完整历史。默认 fetch-depth: 1 只扫最后一个 commit，
          # 历史提交里残留的密钥会被漏掉。
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 静态代码分析：规则在 security/semgrep-rules.yaml，自行维护避免 registry 噪音。
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep SAST
        run: bash scripts/scan_sast.sh

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: reports/semgrep.sarif

  # 依赖漏洞扫描：只阻断有修复方案的 HIGH/CRITICAL，否则门禁会被"上游还没修"的 CVE 卡死。
  # 扫 requirements-lock.txt 而不是 requirements.txt：
  #   - 后者用 >=，版本不确定的包会被 Trivy 跳过
  #   - 文件名必须匹配 requirements*.txt，Trivy 才认作 pip 依赖清单
  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .venv,.git,reports
          format: sarif
          output: reports/trivy.sarif
          exit-code: "1"

      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .venv,.git,reports
          format: cyclonedx
          output: reports/sbom.json

      - name: Upload SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-artifacts
          path: |
            reports/trivy.sarif
            reports/sbom.json

  # 镜像供应链：构建 → 扫描 → 推 GHCR → 签名 → 验签。
  # 签名只证明"这个 digest 是我签的"，不证明"集群会检查它"——
  # 后者要靠 Kyverno 准入策略，见 admission-verify job。
  image-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: reports/trivy-image.sarif
          exit-code: "1"

      - name: Verify image runs as non-root
        run: |
          docker run -d --name probe -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "health endpoint reachable"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          echo -n "container uid: "
          docker exec probe id -u
          docker rm -f probe

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push "$IMAGE" | tail -3
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed digest: $DIGEST"

      - name: Sign image by digest
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          # 按 digest 签名而不是 tag：tag 可以被覆盖，digest 是内容寻址。
          # --tlog-upload=false：不写 Sigstore 透明日志，避免准入验证时依赖 Rekor 可用性。
          # 生产环境应当开启 tlog，这样即使私钥泄露也能追溯伪造。
          cosign sign --yes \
            --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Verify signature with public key
        run: |
          cosign verify \
            --insecure-ignore-tlog=true \
            --key cosign.pub \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-report
          path: reports/trivy-image.sarif

  # 准入验证：证明「签名」和「验证」是两件事。
  # 红绿 A：没有策略时，未签名的镜像照样能跑 —— 说明只签名等于没控制。
  # 红绿 B：启用策略后，未签名镜像被准入控制器拒绝。
  admission-verify:
    needs: image-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: supply-chain

      - name: Install Kyverno
        run: |
          # 必须用 server-side apply：Kyverno 的 CRD 超过 256KB，
          # 客户端 apply 会把它塞进 last-applied-configuration 注解，触发注解长度上限。
          kubectl apply --server-side=true \
            -f https://github.com/kyverno/kyverno/releases/latest/download/install.yaml
          kubectl -n kyverno wait --for=condition=Ready pods --all --timeout=300s
          kubectl wait --for=condition=Established crd/clusterpolicies.kyverno.io --timeout=120s

      - name: Allow cluster to pull from GHCR
        run: |
          kubectl create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
          kubectl patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-auth"}]}'

      - name: Log in to GHCR to build an unsigned counterpart
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push an UNSIGNED image (different digest)
        run: |
          # --label 会改变镜像 config，因此 digest 与已签名镜像不同。
          # 这正是要测的场景：内容不同、且没有签名。
          UNSIGNED=ghcr.io/${{ github.repository }}:unsigned
          docker build -t "$UNSIGNED" --label org.example.signed=false .
          docker push "$UNSIGNED" | tail -2
          echo "unsigned ref: $UNSIGNED"
          docker inspect --format='{{index .RepoDigests 0}}' "$UNSIGNED"

      - name: "Red A · no policy → unsigned image is admitted"
        run: |
          UNSIGNED=ghcr.io/${{ github.repository }}:unsigned
          kubectl run probe-unsigned --image="$UNSIGNED" --port=8000
          kubectl wait --for=condition=Ready pod/probe-unsigned --timeout=240s
          echo "✅ 未启用策略时，未签名镜像成功运行 —— 证明签名本身不构成控制"
          kubectl delete pod probe-unsigned --wait=false

      - name: Apply verifyImages policy
        run: |
          kubectl apply -f policies/verify-images.yaml
          kubectl wait --for=condition=Ready clusterpolicy/verify-image-signature --timeout=180s
          kubectl get clusterpolicy verify-image-signature -o yaml | head -20

      - name: "Red B · policy on → signed admitted, unsigned rejected"
        run: |
          SIGNED=ghcr.io/${{ github.repository }}:${{ github.sha }}
          UNSIGNED=ghcr.io/${{ github.repository }}:unsigned

          echo "--- 已签名镜像应当被放行 ---"
          kubectl run probe-signed --image="$SIGNED" --port=8000
          kubectl wait --for=condition=Ready pod/probe-signed --timeout=240s
          echo "✅ 已签名镜像正常准入"

          echo "--- 未签名镜像应当被拒绝 ---"
          set +e
          OUTPUT=$(kubectl run probe-reject --image="$UNSIGNED" --port=8000 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            echo "❌ 策略未生效：未签名镜像被准入"
            kubectl delete pod probe-reject --wait=false || true
            exit 1
          fi
          echo "✅ 未签名镜像被准入控制器拒绝"
