name: CI Quality Gate

# PR 触发：任何向 main / dev 的 PR 都必须先过这一关。
# workflow_dispatch：允许手动重跑，便于排查与演示。
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 逻辑全部在 scripts/ 里，这里只做编排 —— 换 GitLab CI 时 yaml 重写、脚本不动。
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: bash scripts/install.sh

      - name: API tests
        run: bash scripts/test_api.sh

      - name: E2E smoke
        run: bash scripts/test_e2e.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  # 评测门禁：证明「模型变差也能拦住」。独立 job 便于在 PR 上单独看到准确率结论。
  eval-gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      EXTRACTOR_BACKEND: replay
      PROMPT_VERSION: v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: bash scripts/install.sh

      - name: Extraction accuracy eval
        run: bash scripts/test_eval.sh

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval-report.md

  # 凭证扫描：密钥泄露零容忍，任何发现都阻断。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须取完整历史。默认 fetch-depth: 1 只扫最后一个 commit，
          # 历史提交里残留的密钥会被漏掉。
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 静态代码分析：规则在 security/semgrep-rules.yaml，自行维护避免 registry 噪音。
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep SAST
        run: bash scripts/scan_sast.sh

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: reports/semgrep.sarif

  # 依赖漏洞扫描：只阻断有修复方案的 HIGH/CRITICAL，否则门禁会被"上游还没修"的 CVE 卡死。
  # 扫 requirements-lock.txt 而不是 requirements.txt：
  #   - 后者用 >=，版本不确定的包会被 Trivy 跳过
  #   - 文件名必须匹配 requirements*.txt，Trivy 才认作 pip 依赖清单
  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .venv,.git,reports
          format: sarif
          output: reports/trivy.sarif
          exit-code: "1"

      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .venv,.git,reports
          format: cyclonedx
          output: reports/sbom.json

      - name: Upload SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-artifacts
          path: |
            reports/trivy.sarif
            reports/sbom.json

  # 镜像供应链：构建 → 扫描 → 推 GHCR → 签名 → 验签。
  # 签名只证明"这个 digest 是我签的"，不证明"集群会检查它"——
  # 后者要靠 Kyverno 准入策略，见 admission-verify job。
  image-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Build image
        run: |
          # --provenance=false：BuildKit 默认附加 provenance attestation，
          # 会把镜像变成 manifest list。那样签名签的是 list 的 digest，
          # 而准入控制器解析到的是平台 manifest 的 digest，两者对不上，
          # 导致「已签名镜像也被拒绝」。关掉它让 digest 唯一。
          docker build --provenance=false \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: reports/trivy-image.sarif
          exit-code: "1"

      - name: Verify image runs as non-root
        run: |
          docker run -d --name probe -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "health endpoint reachable"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          echo -n "container uid: "
          docker exec probe id -u
          docker rm -f probe

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push signed image
        id: push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push "$IMAGE" | tail -3
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed digest: $DIGEST"

      - name: Push an UNSIGNED counterpart for the admission test
        run: |
          # --label 会改变镜像 config，因此 digest 与已签名镜像不同。
          # 这正是准入实验需要的对照物：内容不同，且没有签名。
          UNSIGNED=ghcr.io/${{ github.repository }}:unsigned
          docker build --provenance=false -t "$UNSIGNED" --label org.example.signed=false .
          docker push "$UNSIGNED" | tail -2
          docker inspect --format='{{index .RepoDigests 0}}' "$UNSIGNED"

      - name: Sign image by digest
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          # 按 digest 签名而不是 tag：tag 可以被覆盖，digest 是内容寻址。
          # 必须上传 tlog（默认行为）：准入控制器会校验透明日志条目，
          # 用 --tlog-upload=false 签出来的签名会被 Kyverno 判为无效。
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Verify signature with public key
        run: |
          cosign verify \
            --key cosign.pub \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-report
          path: reports/trivy-image.sarif

  # 闭环：扫描失败时把发现落成 Issue，而不是只留在日志里。
  # 这不是门禁（不阻断合并），而是 Memory —— 让问题可追踪、可分配、可复盘。
  # 幂等由 scripts/issue_reporter.py 保证：同一指纹只更新，不重复建单。
  issue-sync:
    needs: sca-scan
    if: always() && needs.sca-scan.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SCA report
        uses: actions/download-artifact@v4
        with:
          name: sca-artifacts
          path: reports

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync findings to issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.report_findings reports/trivy.sarif

  # 例外到期检查：给发现打 exception:expire-YYYY-MM-DD 标签，
  # 到期后自动移除标签并评论提醒，防止"临时豁免"变成永久豁免。
  exception-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Expire outdated exceptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.expire_exceptions
  # 红绿 A：没有策略时，未签名的镜像照样能跑 —— 说明只签名等于没控制。
  # 红绿 B：启用策略后，未签名镜像被准入控制器拒绝。
  # 准入验证：证明「签名」和「验证」是两件事。
  # 红绿 A：没有策略时，未签名的镜像照样能跑 —— 说明只签名等于没控制。
  # 红绿 B：启用策略后，未签名镜像被准入控制器拒绝。
  admission-verify:
    needs: image-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: supply-chain

      - name: Install Kyverno
        run: |
          # 必须用 server-side apply：Kyverno 的 CRD 超过 256KB，
          # 客户端 apply 会把它塞进 last-applied-configuration 注解，触发注解长度上限。
          kubectl apply --server-side=true \
            -f https://github.com/kyverno/kyverno/releases/latest/download/install.yaml
          kubectl -n kyverno wait --for=condition=Ready pods --all --timeout=300s
          kubectl wait --for=condition=Established crd/clusterpolicies.kyverno.io --timeout=120s

      - name: Allow cluster to pull from GHCR
        run: |
          kubectl create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
          kubectl patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-auth"}]}'

      - name: "Red A · no policy → unsigned image is admitted"
        run: |
          UNSIGNED=ghcr.io/${{ github.repository }}:unsigned
          kubectl run probe-unsigned --image="$UNSIGNED" --port=8000
          kubectl wait --for=condition=Ready pod/probe-unsigned --timeout=240s
          echo "✅ 未启用策略时，未签名镜像成功运行 —— 证明签名本身不构成控制"
          kubectl delete pod probe-unsigned --wait=false

      - name: Apply verifyImages policy
        run: |
          kubectl apply -f policies/verify-images.yaml
          kubectl get imagevalidatingpolicy verify-image-signature
          # 等 webhook 完成注册并缓存策略
          sleep 15
          kubectl get imagevalidatingpolicy verify-image-signature \
            -o jsonpath='{.status}' || true

      - name: "Red B · policy on → signed admitted, unsigned rejected"
        run: |
          SIGNED=ghcr.io/${{ github.repository }}:${{ github.sha }}
          UNSIGNED=ghcr.io/${{ github.repository }}:unsigned

          echo "--- 已签名镜像应当被放行 ---"
          kubectl run probe-signed --image="$SIGNED" --port=8000
          kubectl wait --for=condition=Ready pod/probe-signed --timeout=240s
          echo "✅ 已签名镜像正常准入"

          echo "--- 未签名镜像应当被拒绝 ---"
          set +e
          OUTPUT=$(kubectl run probe-reject --image="$UNSIGNED" --port=8000 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            echo "❌ 策略未生效：未签名镜像被准入"
            kubectl delete pod probe-reject --wait=false || true
            exit 1
          fi
          echo "✅ 未签名镜像被准入控制器拒绝"

  # Pager：门禁失败时把消息推到飞书，而不是等人想起来去看 Actions。
  # 关键约束：只对 dev/main 告警。PR 失败也发消息的话，一天几十条，
  # 一周后所有人静音群 —— 那比不接告警更糟。
  notify-on-failure:
    needs:
      - quality-gate
      - eval-gate
      - secret-scan
      - sast-scan
      - sca-scan
      - image-pipeline
      - admission-verify
    if: always() && failure()  # TEMP: 测试用，验证后收紧为 dev only
    runs-on: ubuntu-latest
    steps:
      - name: Collect failed jobs and notify Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          FAILED=""
          [ "${{ needs.quality-gate.result }}" = "failure" ] && FAILED="$FAILED quality-gate"
          [ "${{ needs.eval-gate.result }}" = "failure" ] && FAILED="$FAILED eval-gate"
          [ "${{ needs.secret-scan.result }}" = "failure" ] && FAILED="$FAILED secret-scan"
          [ "${{ needs.sast-scan.result }}" = "failure" ] && FAILED="$FAILED sast-scan"
          [ "${{ needs.sca-scan.result }}" = "failure" ] && FAILED="$FAILED sca-scan"
          [ "${{ needs.image-pipeline.result }}" = "failure" ] && FAILED="$FAILED image-pipeline"
          [ "${{ needs.admission-verify.result }}" = "failure" ] && FAILED="$FAILED admission-verify"
          [ -z "$FAILED" ] && FAILED="（未能识别，请查看运行日志）"

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '🔴 dev 门禁失败\n失败项：%s\n提交：%s\n作者：%s\n详情：%s' \
            "$FAILED" "${GITHUB_SHA:0:7}" "${{ github.actor }}" "$RUN_URL")

          # 用 jq 生成 JSON，避免中文/换行破坏 payload
          jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
            | curl -sS -X POST "$FEISHU_WEBHOOK" -H "Content-Type: application/json" -d @-
